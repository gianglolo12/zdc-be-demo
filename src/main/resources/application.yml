spring:
  application:
    name: zdc-be
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33306/config_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:36379}

server:
  port: ${SERVER_PORT:8080}
