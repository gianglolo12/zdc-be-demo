spring:
  application:
    name: zdc-be
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33306/config_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:36379}

server:
  port: ${SERVER_PORT:8080}

zdc:
  order:
    create-lock-ttl: 10s
    payment-return-url: ${PAYMENT_RETURN_URL:https://zdc.vn/api/v1/order/callback}
    outbox-poll-ms: 1000
  downstream:
    back-office-url: ${BO_URL:http://localhost:8081}
    pricing-url: ${PRICING_URL:http://localhost:8082}
    commercial-url: ${COMMERCIAL_URL:http://localhost:8083}
    payment-url: ${PAYMENT_URL:http://localhost:8084}
